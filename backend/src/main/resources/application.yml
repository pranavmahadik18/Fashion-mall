spring:
  application:
    name: shop
  datasource:
    # MySQL Configuration (Primary)
    url: ${DB_URL:jdbc:mysql://localhost:3306/fashion_house_shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ROOT}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# JWT Configuration
app:
  jwtSecret: ${JWT_SECRET:8f4b5a2e9c1d3f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 hours

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:demo}
  api_key: ${CLOUDINARY_API_KEY:123456789}
  api_secret: ${CLOUDINARY_API_SECRET:abcdefg}

server:
  port: ${PORT:8081}
  
cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173}

upload:
  dir: ${UPLOAD_DIR:uploads}

razorpay:
  key_id: ${RAZORPAY_KEY_ID:rzp_test_Tlv0kjyJi0pHjb}
  key_secret: ${RAZORPAY_KEY_SECRET:zWcnH9kBZt5k1chvhgk53gWT}
